openapi: 3.0.3
info:
  title: ReviewPilot S1
  version: 1.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '401':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/repositories:
    get:
      operationId: listRepositories
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryListResponse'
        '401':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/runs:
    get:
      operationId: listRuns
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '401':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/repositories/sync:
    post:
      operationId: syncRepositories
      responses:
        '204':
          description: Synchronized
        '403':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /api/repositories/{installationId}/{repositoryId}:
    parameters:
      - in: path
        name: installationId
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      - in: path
        name: repositoryId
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    post:
      operationId: setRepositoryEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRepositoryEnabledRequest'
      responses:
        '204':
          description: Updated
        '403':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
components:
  schemas:
    TenantRef:
      type: object
      additionalProperties: false
      required:
        - installationId
        - repositoryId
      properties:
        installationId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        repositoryId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    RunSnapshot:
      type: object
      additionalProperties: false
      required:
        - identity
        - modelConfigVersion
        - repositoryConfigVersion
        - memorySetVersion
        - trustedRulesSha
      properties:
        identity:
          type: object
          additionalProperties: false
          required:
            - tenant
            - prNumber
            - baseSha
            - headSha
            - pipelineVersion
            - generation
          properties:
            tenant:
              $ref: '#/components/schemas/TenantRef'
            prNumber:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            baseSha:
              type: string
              pattern: ^[0-9a-f]{40}$
            headSha:
              type: string
              pattern: ^[0-9a-f]{40}$
            pipelineVersion:
              type: string
              minLength: 1
              maxLength: 200
            generation:
              type: integer
              minimum: 0
        modelConfigVersion:
          type: string
          minLength: 1
          maxLength: 200
        repositoryConfigVersion:
          type: string
          minLength: 1
          maxLength: 200
        memorySetVersion:
          type: string
          minLength: 1
          maxLength: 200
        trustedRulesSha:
          type: string
          maxLength: 40
    TaskEnvelope:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - messageId
        - taskId
        - runId
        - tenant
        - headSha
        - kind
        - notificationGeneration
      properties:
        schemaVersion:
          enum:
            - 1
          type: integer
        messageId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        taskId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        runId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        tenant:
          $ref: '#/components/schemas/TenantRef'
        headSha:
          type: string
          pattern: ^[0-9a-f]{40}$
        kind:
          type: string
          enum:
            - connection-check
            - evolution
        notificationGeneration:
          type: integer
          minimum: 0
        traceparent:
          type: string
          maxLength: 55
          pattern: ^00-[0-9a-f]{32}-[0-9a-f]{16}-0[01]$
        tracestate:
          type: string
          maxLength: 512
    TaskLease:
      type: object
      additionalProperties: false
      required:
        - taskId
        - runId
        - leaseToken
        - attempt
        - expiresAt
        - snapshot
        - inputHash
        - executionEpoch
      properties:
        taskId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        runId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        leaseToken:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        attempt:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/RunSnapshot'
        inputHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        executionEpoch:
          type: integer
          minimum: 0
    ClaimRequest:
      type: object
      additionalProperties: false
      required:
        - workerId
        - envelope
      properties:
        workerId:
          type: string
          minLength: 1
          maxLength: 200
        envelope:
          $ref: '#/components/schemas/TaskEnvelope'
    ClaimResponse:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - claimed
            - busy
            - not-ready
            - finished
            - cancelled
            - exhausted
            - superseded
        lease:
          $ref: '#/components/schemas/TaskLease'
    ConnectionResult:
      type: object
      additionalProperties: false
      required:
        - resultId
        - taskId
        - runId
        - leaseToken
        - executionEpoch
        - inputHash
        - resultHash
        - kind
      properties:
        resultId:
          type: string
          minLength: 1
          maxLength: 200
        taskId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        runId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        leaseToken:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        executionEpoch:
          type: integer
          minimum: 0
        inputHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        resultHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        kind:
          type: string
          enum:
            - connection-check
    CommitResponse:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum:
            - accepted
            - already-accepted
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 200
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - phase
        - aiReviewEnabled
      properties:
        phase:
          type: string
          enum:
            - foundation
        aiReviewEnabled:
          type: boolean
          enum:
            - false
    BootstrapResponse:
      type: object
      additionalProperties: false
      properties:
        phase:
          type: string
          enum:
            - foundation
        aiReviewEnabled:
          type: boolean
          enum:
            - false
        missingConfiguration:
          type: array
          items:
            type: string
        installUrl:
          type: string
      required:
        - phase
        - aiReviewEnabled
        - missingConfiguration
    SessionResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          type: object
          additionalProperties: false
          properties:
            id:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            login:
              type: string
          required:
            - id
            - login
        csrfToken:
          type: string
      required:
        - user
        - csrfToken
    RepositorySummary:
      type: object
      additionalProperties: false
      properties:
        tenant:
          $ref: '#/components/schemas/TenantRef'
        fullName:
          type: string
        public:
          type: boolean
        enabled:
          type: boolean
        configVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        canManage:
          type: boolean
      required:
        - tenant
        - fullName
        - public
        - enabled
        - configVersion
        - canManage
    RepositoryListResponse:
      type: object
      additionalProperties: false
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/RepositorySummary'
      required:
        - repositories
    RunSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        tenant:
          $ref: '#/components/schemas/TenantRef'
        fullName:
          type: string
        prNumber:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        headSha:
          type: string
        status:
          type: string
          enum:
            - Queued
            - Indexing
            - Reviewing
            - Verifying
            - Publishing
            - Completed
            - Partial
            - Stale
            - Cancelled
            - Failed
        createdAt:
          type: string
          format: date-time
        checkId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - id
        - tenant
        - fullName
        - prNumber
        - headSha
        - status
        - createdAt
    RunListResponse:
      type: object
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        aiReviewEnabled:
          type: boolean
          enum:
            - false
      required:
        - runs
        - aiReviewEnabled
    SetRepositoryEnabledRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        configVersion:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
        - enabled
        - configVersion
