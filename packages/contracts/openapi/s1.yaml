components:
  schemas:
    TenantRef:
      type: object
      additionalProperties: false
      required:
        - installationId
        - repositoryId
      properties:
        installationId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        repositoryId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    RunSnapshot:
      type: object
      additionalProperties: false
      required:
        - identity
        - modelConfigVersion
        - repositoryConfigVersion
        - memorySetVersion
        - trustedRulesSha
      properties:
        identity:
          type: object
          additionalProperties: false
          required:
            - tenant
            - prNumber
            - baseSha
            - headSha
            - pipelineVersion
            - generation
